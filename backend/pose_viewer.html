                for (let i = 0; i < 5; i++) {
                    const tx = isLeft ? -toeXR[i] : toeXR[i];
                    const toe = new THREE.Mesh(new THREE.SphereGeometry(0.012 * S, 8, 6), mat);
                    toe.scale.set(0.85, 0.55, 1.35);
                    toe.position.set(tx * S, -0.014 * S, (0.192 + toeLen[i] * 0.5) * S);
                    group.add(toe);
                }
                // 白模原本的设计就是以脚踝为中心，所以偏移为 0
                group.userData.ankleLocal = new THREE.Vector3(0, 0, 0);
            }
            return group;
        }
        /** Make an appendage bone cylinder between two joint objects. radius in world units. */
        function makeAppendageBone(jA, jB, color, radius) {
            const pA = jA.getWorldPosition(new THREE.Vector3());
            const pB = jB.getWorldPosition(new THREE.Vector3());
            const bone = makeBoneCylinder(pA, pB, radius || BONE_R_OP * 0.55, color);
            bone.userData.isOpAppendageBone = true;
            scene.add(bone);
            return { mesh: bone, jA, jB };
        }

        function addOpHands() {
            if (opPersonGroups.length === 0) return;
            if (handsActive) { clearOpHands(); return; }
            const { joints, scaleFactor: sf = 1 } = opPersonGroups[0];
            // Right hand: elbow=joints[3], wrist=joints[4]
            const basisR = getHandBasis(joints[3], joints[4], false);
            const wpR = joints[4].getWorldPosition(new THREE.Vector3());
            opAppendages.rightHand = buildHandSpheres(false, wpR, basisR, sf);
            const hr = BONE_R_OP * 0.45 * sf;
            // Connect body wrist to hand wrist (index 0)
            opAppendageBones.push(makeAppendageBone(joints[4], opAppendages.rightHand[0], 0xff4444, hr));
            for (const [a, b] of OP_HAND_CONNECTIONS) {
                opAppendageBones.push(makeAppendageBone(opAppendages.rightHand[a], opAppendages.rightHand[b], fingerColorFor(a), hr));
            }
            // Left hand: elbow=joints[6], wrist=joints[7]
            const basisL = getHandBasis(joints[6], joints[7], true);
            const wpL = joints[7].getWorldPosition(new THREE.Vector3());
            opAppendages.leftHand = buildHandSpheres(true, wpL, basisL, sf);
            // Connect body wrist to hand wrist (index 0)
            opAppendageBones.push(makeAppendageBone(joints[7], opAppendages.leftHand[0], 0xff4444, hr));
            for (const [a, b] of OP_HAND_CONNECTIONS) {
                opAppendageBones.push(makeAppendageBone(opAppendages.leftHand[a], opAppendages.leftHand[b], fingerColorFor(a), hr));
            }
            handsActive = true;
            document.getElementById('btn-add-hands')?.classList.add('active');
            initRigidSkeletonBaseline();
            saveState();
        }

        function clearOpHands() {
            for (const sp of [...opAppendages.rightHand, ...opAppendages.leftHand]) {
                scene.remove(sp);
                jointNodes = jointNodes.filter(n => n !== sp);
            }
            opAppendages.rightHand = [];
            opAppendages.leftHand = [];
            const kept = [];
            for (const b of opAppendageBones) {
                const kind = b.jA?.userData?.appendageKind || b.jB?.userData?.appendageKind;
                if (kind === 'lhand' || kind === 'rhand') { scene.remove(b.mesh); }
                else kept.push(b);
            }
            opAppendageBones = kept;
            handsActive = false;
            document.getElementById('btn-add-hands')?.classList.remove('active');
            saveState();
        }

        function addOpFeet() {
            if (opPersonGroups.length === 0) return;
            if (feetActive) { clearOpFeet(); return; }
            const { joints, scaleFactor: sf = 1 } = opPersonGroups[0];

            const forward = (() => {
                const rShldr = joints[2].getWorldPosition(new THREE.Vector3());
                const lShldr = joints[5].getWorldPosition(new THREE.Vector3());
                let sideDir = new THREE.Vector3().subVectors(lShldr, rShldr);
                let source = 'shoulder';
                if (sideDir.lengthSq() < 1e-6) {
                    const rHip = joints[8].getWorldPosition(new THREE.Vector3());
                    const lHip = joints[11].getWorldPosition(new THREE.Vector3());
                    sideDir = new THREE.Vector3().subVectors(lHip, rHip);
                    source = 'hip';
                }
                if (sideDir.lengthSq() > 1e-6) {
                    sideDir.normalize();
                    const fwd = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), sideDir).normalize();
                    if (fwd.lengthSq() > 1e-6) {
                        console.log('[Foot] forward basis', {
                            source,
                            rShldr: rShldr.toArray(),
                            lShldr: lShldr.toArray(),
                            sideDir: sideDir.toArray(),
                            forward: fwd.toArray(),
                        });
                        return fwd;
                    }
                }
                const fallback = new THREE.Vector3(0, 0, 1);
                console.log('[Foot] forward fallback', { source, fallback: fallback.toArray() });
                return fallback;
            })();

            function placeFoot(isLeft, ankleJoint, kneeJoint) {
                const wp = ankleJoint.getWorldPosition(new THREE.Vector3());
                const footGroup = createFootGroup(isLeft, sf);

                // --- 计算脚的初始朝向（朝向相机） ---
                const up = new THREE.Vector3(0, 1, 0);
                let forwardCam = new THREE.Vector3();
                try {
                    const camPos = new THREE.Vector3();
                    camera.getWorldPosition(camPos);
                    forwardCam.subVectors(camPos, wp);
                    forwardCam.y = 0;
                    if (forwardCam.lengthSq() > 1e-6) forwardCam.normalize();
                    else forwardCam.copy(forward);
                } catch (e) {
                    forwardCam.copy(forward);
                }
                const right = new THREE.Vector3().crossVectors(up, forwardCam).normalize();
                if (right.lengthSq() < 1e-6) right.set(1, 0, 0);
                const basis = new THREE.Matrix4().makeBasis(right, up, forwardCam);

                // 设置旋转，并把对象加入场景
                footGroup.setRotationFromMatrix(basis);
                scene.add(footGroup);

                // --- 【核心修复3】：完美对齐脚踝 ---
                footGroup.updateMatrixWorld(true);

                // 目标点：骨骼脚踝关节的绝对世界坐标
                const desiredAnkleWorld = ankleJoint.getWorldPosition(new THREE.Vector3());

                // 当前点：鞋子里记录的“脚踝”经过旋转后的绝对世界坐标
                const currentAnkleWorld = footGroup.localToWorld(footGroup.userData.ankleLocal.clone());

                // 算出它们之间的距离差，把鞋子直接平移过去
                const deltaWorld = new THREE.Vector3().subVectors(desiredAnkleWorld, currentAnkleWorld);
                footGroup.position.add(deltaWorld);

                // 记录放置时的初始四元数，供旋转跟随使用
                footGroup.userData.initialFootQuaternion = footGroup.quaternion.clone();
                footGroup.userData.initialAnkleQuaternion = ankleJoint.getWorldQuaternion(new THREE.Quaternion());

                // 记录放置时的小腿方向（膝→踝），用于跟随父关节旋转
                if (kneeJoint) {
                    const kneePos = kneeJoint.getWorldPosition(new THREE.Vector3());
                    const anklePos = ankleJoint.getWorldPosition(new THREE.Vector3());
                    const shinDir = new THREE.Vector3().subVectors(anklePos, kneePos);
                    if (shinDir.lengthSq() > 1e-6)
                        footGroup.userData.initialShinDir = shinDir.normalize();
                }

                return footGroup;
            }
            opFeetMeshes.right = placeFoot(false, joints[10], joints[9]);
            opFeetMeshes.left = placeFoot(true, joints[13], joints[12]);

            feetActive = true;
            document.getElementById('btn-add-feet')?.classList.add('active');
        }

        function clearOpFeet() {
            if (opFeetMeshes.right) { scene.remove(opFeetMeshes.right); opFeetMeshes.right = null; }
            if (opFeetMeshes.left) { scene.remove(opFeetMeshes.left); opFeetMeshes.left = null; }
            if (tcl.object?.userData?.isFootMesh) tcl.detach();
            feetActive = false;
            document.getElementById('btn-add-feet')?.classList.remove('active');
        }

        function clearOpAppendages() {
            clearOpHands();
            clearOpFeet();
        }

        /** Update all appendage bone cylinders to follow moved joints. */
        function updateOpAppendageBones() {
            const up = new THREE.Vector3(0, 1, 0);
            for (const { mesh, jA, jB } of opAppendageBones) {
                const pA = jA.getWorldPosition(new THREE.Vector3());
                const pB = jB.getWorldPosition(new THREE.Vector3());
                const dir = new THREE.Vector3().subVectors(pB, pA);
                const len = dir.length();
                mesh.position.copy(new THREE.Vector3().addVectors(pA, pB).multiplyScalar(0.5));
                mesh.scale.set(1, Math.max(len, 1e-4), 1);
                if (len > 1e-5) mesh.quaternion.setFromUnitVectors(up, dir.normalize());
            }
        }

        /** Update foot meshes to follow ankle joints (position + rotation). */
        function updateOpFootMeshes() {
            if (!feetActive || !opPersonGroups.length) return;
            const { joints } = opPersonGroups[0];

            function syncFoot(g, ankleJoint, kneeJoint) {
                if (!g || !ankleJoint) return;

                // 1. Rotation: follow shin direction (knee → ankle) so the foot
                //    rotates when parent joints (hip/knee) move via FK.
                //    User's manual ankle rotation is applied on top.
                if (g.userData.initialFootQuaternion) {
                    let baseQ = g.userData.initialFootQuaternion.clone();

                    if (kneeJoint && g.userData.initialShinDir) {
                        const kneePos = kneeJoint.getWorldPosition(new THREE.Vector3());
                        const anklePos = ankleJoint.getWorldPosition(new THREE.Vector3());
                        const currentShin = new THREE.Vector3().subVectors(anklePos, kneePos);
                        if (currentShin.lengthSq() > 1e-6) {
                            currentShin.normalize();
                            const shinDelta = new THREE.Quaternion().setFromUnitVectors(
                                g.userData.initialShinDir, currentShin);
                            baseQ.premultiply(shinDelta);
                        }
                    }

                    // Apply user's manual ankle rotation as additional offset
                    if (g.userData.initialAnkleQuaternion) {
                        const q0 = g.userData.initialAnkleQuaternion;
                        const q1 = ankleJoint.getWorldQuaternion(new THREE.Quaternion());
                        const manualDelta = q1.clone().multiply(q0.clone().invert());
                        baseQ.premultiply(manualDelta);
                    }

                    g.quaternion.copy(baseQ);
                    g.updateMatrixWorld(true);
                }

                // 2. Position: re-align ankleLocal to ankle joint's world position
                const desiredAnkleWorld = ankleJoint.getWorldPosition(new THREE.Vector3());
                if (g.userData.ankleLocal) {
                    const currentAnkleWorld = g.localToWorld(g.userData.ankleLocal.clone());
                    const delta = new THREE.Vector3().subVectors(desiredAnkleWorld, currentAnkleWorld);
                    g.position.add(delta);
                } else {
                    g.position.copy(desiredAnkleWorld);
                }
            }

            syncFoot(opFeetMeshes.right, joints[10], joints[9]);
            syncFoot(opFeetMeshes.left, joints[13], joints[12]);
        }

        // ══════════════════════════════════════════════
        // WHOLEBODY MODE (MediaPipe body + hands + face)
        // ══════════════════════════════════════════════

        function clearWholebody() {
            tcl.detach();
            if (wbGroup) { scene.remove(wbGroup); wbGroup = null; }
            jointNodes = jointNodes.filter(n => !n.userData.isWbJoint);
            boneMeshes = boneMeshes.filter(n => !n.userData.isWbBone);
            wbJoints = { body: [], leftHand: [], rightHand: [], face: [] };
            wbBones = [];
            wbData = null;
            undoStack = []; redoStack = [];
        }

        function makeWbSphere(x, y, z, radius, color, userDataExtra) {
            const mesh = new THREE.Mesh(
                new THREE.SphereGeometry(radius, 10, 8),
                new THREE.MeshBasicMaterial({ color, depthTest: false })
            );
            mesh.renderOrder = 1;
            mesh.position.set(x, y, z);
            mesh.userData.isWbJoint = true;
            Object.assign(mesh.userData, userDataExtra);
            jointNodes.push(mesh);
            return mesh;
        }

        function makeWbBone(a, b, color) {
            const bone = makeBoneCylinder(a.position, b.position, 0.006, color);
            bone.userData.isWbBone = true;
            boneMeshes.push(bone);
            return bone;
        }

        function updateWbBones() {
            for (const { mesh, jA, jB } of wbBones) {
                const pA = jA.getWorldPosition(new THREE.Vector3());
                const pB = jB.getWorldPosition(new THREE.Vector3());
                const dir = new THREE.Vector3().subVectors(pB, pA);
                const len = dir.length();
                mesh.position.copy(new THREE.Vector3().addVectors(pA, pB).multiplyScalar(0.5));
                mesh.scale.set(1, Math.max(len, 1e-4), 1);
                if (len > 1e-5) mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
            }
        }

        function fingerColorFor(handLandmarkIdx) {
            // Map hand landmark index to finger color
            if (handLandmarkIdx <= 4) return HAND_FINGER_COLORS[0]; // thumb
            if (handLandmarkIdx <= 8) return HAND_FINGER_COLORS[1]; // index
            if (handLandmarkIdx <= 12) return HAND_FINGER_COLORS[2]; // middle
            if (handLandmarkIdx <= 16) return HAND_FINGER_COLORS[3]; // ring
            return HAND_FINGER_COLORS[4]; // pinky
        }

        function loadWholebodyJSON(data, bgUrl) {
            clearWholebody();
            setMode('wholebody');
            wbData = data;
            wbGroup = new THREE.Group();
            wbGroup.name = 'wholebody';

            // ── Body joints ────────────────────────────────────────────────────────
            const bodyColors = [
                0xff4444, 0xff8c00, 0xffdd00, 0x88ff44, 0x44ffdd, 0x44aaff, 0x8866ff, 0xff44cc,
                0xff6666, 0xffaa44, 0xffee66, 0xaaff66, 0x66ffee, 0x66ccff, 0xaa88ff, 0xff66ee,
                0xff8888, 0xffcc88, 0xffff88, 0xccff88, 0x88ffee, 0x88ddff, 0xccaaff, 0xff88ee,
                0xffaaaa, 0xffddaa, 0xffffaa, 0xddffaa, 0xaaffff, 0xaaddff, 0xddccff, 0xffaaff,
                0xffcccc,
            ];
            const BODY_R = 0.022;
            for (let i = 0; i < data.body.length; i++) {
                const [x, y, z] = data.body[i];
                const col = bodyColors[i % bodyColors.length];
                const sp = makeWbSphere(x, y, z, BODY_R, col, { wbKind: 'body', wbIdx: i });
                wbGroup.add(sp);
                wbJoints.body.push(sp);
            }
            // Body bone cylinders
            for (const [a, b] of data.body_connections) {
                if (a >= wbJoints.body.length || b >= wbJoints.body.length) continue;
                const bone = makeWbBone(wbJoints.body[a], wbJoints.body[b], 0x888888);
                wbGroup.add(bone);
                wbBones.push({ mesh: bone, jA: wbJoints.body[a], jB: wbJoints.body[b] });
            }

            // ── Hand joints ────────────────────────────────────────────────────────
            const HAND_R = 0.012;
            function addHand(pts, connList, store, sideColor) {
                if (!pts || pts.length === 0) return;
                const spheres = [];
                for (let i = 0; i < pts.length; i++) {
                    const [x, y, z] = pts[i];
                    const col = fingerColorFor(i);
                    const sp = makeWbSphere(x, y, z, HAND_R, col, { wbKind: store === wbJoints.leftHand ? 'lhand' : 'rhand', wbIdx: i });
                    wbGroup.add(sp);
                    spheres.push(sp);
                    store.push(sp);
                }
                for (const [a, b] of connList) {
                    if (a >= spheres.length || b >= spheres.length) continue;
                    const col = fingerColorFor(a);
                    const bone = makeWbBone(spheres[a], spheres[b], col);
                    wbGroup.add(bone);
                    wbBones.push({ mesh: bone, jA: spheres[a], jB: spheres[b] });
                }
            }
            addHand(data.left_hand, data.hand_connections, wbJoints.leftHand, 0x4d96ff);
            addHand(data.right_hand, data.hand_connections, wbJoints.rightHand, 0xffd93d);

            // ── Face key landmarks ─────────────────────────────────────────────────
            const FACE_R = 0.007;
            if (data.face && data.face.length > 0) {
                const faceSpheres = [];
                for (let i = 0; i < data.face.length; i++) {
                    const [x, y, z] = data.face[i];
                    const sp = makeWbSphere(x, y, z, FACE_R, 0xdddddd, { wbKind: 'face', wbIdx: i });
                    wbGroup.add(sp);
                    faceSpheres.push(sp);
                    wbJoints.face.push(sp);
                }
                for (const [a, b] of data.face_connections) {
                    if (a >= faceSpheres.length || b >= faceSpheres.length) continue;
                    const bone = makeWbBone(faceSpheres[a], faceSpheres[b], 0x888888);
                    wbGroup.add(bone);
                    wbBones.push({ mesh: bone, jA: faceSpheres[a], jB: faceSpheres[b] });
                }
            }

            scene.add(wbGroup);

            // Auto-frame camera
            camera.position.set(0, 0.85, 3.5);
            orbit.target.set(0, 0.85, 0);
            orbit.update();

            if (bgUrl) loadBg(bgUrl);
            saveState();
            window.parent.postMessage({ type: 'MODEL_LOADED' }, '*');
            showStatus('全身骨骼已加载 — 可直接拖拽调整手指 / 面部关节', 3000);
        }

        // Update wholebody bones every frame (called from animate loop)
        function tickWholebodyBones() {
            if (currentMode !== 'wholebody') return;
            updateWbBones();
        }

        // ══════════════════════════════════════════════
        // UNDO / REDO
        // ══════════════════════════════════════════════
        // JOINT LIMB CONSTRAINTS (OpenPose mode)
        // Prevent each joint from being dragged further from its kinematic parent
        // than the natural body proportion allows, keeping the OP skeleton in sync
        // with the mannequin mesh.  Ratios = max_segment / body_height, derived from
        // T-pose with a ~15 % margin for flexibility.
        // ══════════════════════════════════════════════
        // Limb constraints for non-root joints (shoulders → elbows → wrists,
        // knees → ankles). Root joints (neck=1, hips=8/11) are handled separately
        // below with non-circular body-height references.
        const JOINT_LIMB_CONSTRAINTS = {
            0: { parent: 1, maxRatio: 0.32 },  // Nose      ← Neck
            2: { parent: 1, maxRatio: 0.45 },  // RShoulder ← Neck
            5: { parent: 1, maxRatio: 0.45 },  // LShoulder ← Neck
            3: { parent: 2, maxRatio: 0.65 },  // RElbow    ← RShoulder
            6: { parent: 5, maxRatio: 0.65 },  // LElbow    ← LShoulder
            4: { parent: 3, maxRatio: 0.65 },  // RWrist    ← RElbow
            7: { parent: 6, maxRatio: 0.65 },  // LWrist    ← LElbow
            9: { parent: 8, maxRatio: 0.90 },  // RKnee     ← RHip
            12: { parent: 11, maxRatio: 0.90 },  // LKnee     ← LHip
            10: { parent: 9, maxRatio: 0.93 },  // RAnkle    ← RKnee
            13: { parent: 12, maxRatio: 0.93 },  // LAnkle    ← LKnee
        };
        // Hips (8,11) handled as a rigid pair separately; all others processed root→leaf.
        const CONSTRAINT_TOPO_ORDER = [0, 2, 5, 3, 6, 9, 12, 4, 7, 10, 13];

        let rigidLengths = null;

        function initRigidSkeletonBaseline() {
            if (opPersonGroups.length === 0 || opPersonGroups[0].joints.length < 14) return;
            const j = opPersonGroups[0].joints;
            const getWP = i => j[i].getWorldPosition(new THREE.Vector3());

            const symMax = (a1, a2, b1, b2) => {
                const distA = getWP(a1).distanceTo(getWP(a2));
                const distB = getWP(b1).distanceTo(getWP(b2));
                return Math.max(distA, distB);
            };

            const rHip = getWP(8);
            const lHip = getWP(11);
            const rSh = getWP(2);
            const lSh = getWP(5);
            const neck = getWP(1);
            const hipMid = rHip.clone().add(lHip).multiplyScalar(0.5);

            rigidLengths = {
                upperArm: symMax(2, 3, 5, 6),
                lowerArm: symMax(3, 4, 6, 7),
                thigh: symMax(8, 9, 11, 12),
                calf: symMax(9, 10, 12, 13),
                neck: getWP(1).distanceTo(getWP(0)),
                bodyH: neck.distanceTo(hipMid),
                hipSpread: rHip.distanceTo(lHip),
                shoulderSpread: rSh.distanceTo(lSh)
            };

            if (typeof handsActive !== 'undefined' && handsActive && typeof opAppendages !== 'undefined') {
                const initHand = (handSpheres, bodyWristIdx) => {
                    if (!handSpheres || handSpheres.length === 0) return null;
                    const getHWP = i => handSpheres[i].getWorldPosition(new THREE.Vector3());
                    const lengths = [];
                    for (const [a, b] of OP_HAND_CONNECTIONS) {
                        lengths.push({a, b, len: getHWP(a).distanceTo(getHWP(b))});
                    }
                    const baseOffsets = [1, 5, 9, 13, 17].map(idx => ({ idx, len: getHWP(idx).distanceTo(getHWP(0)) }));
                    // Distance from body wrist to hand wrist (index 0)
                    const bodyWristWP = j[bodyWristIdx].getWorldPosition(new THREE.Vector3());
                    const wristToHand = bodyWristWP.distanceTo(getHWP(0));
                    return { lengths, baseOffsets, wristToHand, bodyWristIdx };
                };
                rigidLengths.rHand = initHand(opAppendages.rightHand, 4);
                rigidLengths.lHand = initHand(opAppendages.leftHand, 7);
            }

            enforceRigidLengths(true);
        }

        function enforceRigidLengths(forceAll = false) {
            if (currentMode !== 'openpose' || opPersonGroups.length === 0 || !rigidLengths) return;
            const joints = opPersonGroups[0].joints;
            if (joints.length < 14) return;
            
            const activeIdx = forceAll ? -1 : (typeof draggedJoint !== 'undefined' && draggedJoint ? draggedJoint.userData.jointIdx : _lastDraggedIdx);
            const getWP = i => joints[i].getWorldPosition(new THREE.Vector3());

            const getOpDesc = (idx, excludeBranches = []) => {
                const res = [];
                for (const [a, b] of OP_LIMBS) {
                    if (a === idx && !excludeBranches.includes(b)) {
                        res.push(b);
                        res.push(...getOpDesc(b, excludeBranches));
                    }
                }
                return res;
            };
            
            const translateNodeAndDesc = (idx, deltaWorld, excludeBranches = []) => {
                if (deltaWorld.lengthSq() < 1e-8) return;
                const toMove = [idx, ...getOpDesc(idx, excludeBranches)];
                for (const c of toMove) {
                    if (c >= joints.length) continue;
                    const j = joints[c];
                    const wp = j.getWorldPosition(new THREE.Vector3()).add(deltaWorld);
                    if (j.parent) j.parent.worldToLocal(wp);
                    j.position.copy(wp);
                    j.updateMatrixWorld(true);
                    
                    if (c === 4 && typeof opAppendages !== 'undefined' && opAppendages.rightHand) {
                        opAppendages.rightHand.forEach(s => { s.position.add(deltaWorld); s.updateMatrixWorld(true); });
                    }
                    if (c === 7 && typeof opAppendages !== 'undefined' && opAppendages.leftHand) {
                        opAppendages.leftHand.forEach(s => { s.position.add(deltaWorld); s.updateMatrixWorld(true); });
                    }
                }
            };

            const projectRigid = (childIdx, parentIdx, targetLength) => {
                if (!forceAll && activeIdx !== childIdx && activeIdx !== parentIdx) return;
                
                const parentWP = getWP(parentIdx);
                const childWP = getWP(childIdx);
                const currentDist = childWP.distanceTo(parentWP);
                
                if (Math.abs(currentDist - targetLength) > 1e-4) {
                    let dir = new THREE.Vector3().subVectors(childWP, parentWP);
                    if (dir.lengthSq() < 1e-6) dir.set(0, -1, 0);
                    else dir.normalize();
                    
                    const newWP = parentWP.clone().addScaledVector(dir, targetLength);
                    const delta = new THREE.Vector3().subVectors(newWP, childWP);
                    translateNodeAndDesc(childIdx, delta);
                }
            };

            // Hips
            {
                const rHipWP = getWP(8), lHipWP = getWP(11);
                const hipMidC = rHipWP.clone().add(lHipWP).multiplyScalar(0.5);
                const targetSpread = rigidLengths.hipSpread;
                const currentSpread = rHipWP.distanceTo(lHipWP);
                if (Math.abs(currentSpread - targetSpread) > 1e-4) {
                    if (!forceAll && activeIdx === 8) {
                        const newWP = lHipWP.clone().addScaledVector(new THREE.Vector3().subVectors(rHipWP, lHipWP).normalize() || new THREE.Vector3(1,0,0), targetSpread);
                        translateNodeAndDesc(8, new THREE.Vector3().subVectors(newWP, rHipWP));
                    } else if (!forceAll && activeIdx === 11) {
                        const newWP = rHipWP.clone().addScaledVector(new THREE.Vector3().subVectors(lHipWP, rHipWP).normalize() || new THREE.Vector3(-1,0,0), targetSpread);
                        translateNodeAndDesc(11, new THREE.Vector3().subVectors(newWP, lHipWP));
                    } else {
                        const scale = targetSpread / Math.max(currentSpread, 1e-5);
                        [8, 11].forEach(idx => {
                            const wp = getWP(idx);
                            const newWP = hipMidC.clone().addScaledVector(new THREE.Vector3().subVectors(wp, hipMidC), scale);
                            translateNodeAndDesc(idx, new THREE.Vector3().subVectors(newWP, wp));
                        });
                    }
                }
            }

            // Shoulders
            {
                const rShWP = getWP(2), lShWP = getWP(5);
                const shMidC = rShWP.clone().add(lShWP).multiplyScalar(0.5);
                const targetSpread = rigidLengths.shoulderSpread;
                const currentSpread = rShWP.distanceTo(lShWP);
                if (Math.abs(currentSpread - targetSpread) > 1e-4) {
                    if (!forceAll && activeIdx === 2) {
                        const newWP = lShWP.clone().addScaledVector(new THREE.Vector3().subVectors(rShWP, lShWP).normalize() || new THREE.Vector3(1,0,0), targetSpread);
                        translateNodeAndDesc(2, new THREE.Vector3().subVectors(newWP, rShWP));
                    } else if (!forceAll && activeIdx === 5) {
                        const newWP = rShWP.clone().addScaledVector(new THREE.Vector3().subVectors(lShWP, rShWP).normalize() || new THREE.Vector3(-1,0,0), targetSpread);
                        translateNodeAndDesc(5, new THREE.Vector3().subVectors(newWP, lShWP));
                    } else {
                        const scale = targetSpread / Math.max(currentSpread, 1e-5);
                        [2, 5].forEach(idx => {
                            const wp = getWP(idx);
                            const newWP = shMidC.clone().addScaledVector(new THREE.Vector3().subVectors(wp, shMidC), scale);
                            translateNodeAndDesc(idx, new THREE.Vector3().subVectors(newWP, wp));
                        });
                    }
                }
            }
            
            // Neck to HipMid
            {
                const hipMidWP = getWP(8).clone().add(getWP(11)).multiplyScalar(0.5);
                const neckWP = getWP(1);
                const targetH = rigidLengths.bodyH;
                const currentH = neckWP.distanceTo(hipMidWP);
                if (Math.abs(currentH - targetH) > 1e-4) {
                    if (!forceAll && activeIdx === 1) { 
                        // Dragged Neck: move Hips
                        const newWP = neckWP.clone().addScaledVector(new THREE.Vector3().subVectors(hipMidWP, neckWP).normalize() || new THREE.Vector3(0,-1,0), targetH);
                        const delta = new THREE.Vector3().subVectors(newWP, hipMidWP);
                        translateNodeAndDesc(8, delta);
                        translateNodeAndDesc(11, delta);
                    } else {
                        // Dragged Hip (or other): move Neck & Upper Body, EXCLUDING Hips
                        const newWP = hipMidWP.clone().addScaledVector(new THREE.Vector3().subVectors(neckWP, hipMidWP).normalize() || new THREE.Vector3(0,1,0), targetH);
                        translateNodeAndDesc(1, new THREE.Vector3().subVectors(newWP, neckWP), [8, 11]);
                    }
                }
            }

            // Head
            projectRigid(0, 1, rigidLengths.neck);

            // Arms
            projectRigid(3, 2, rigidLengths.upperArm);
            projectRigid(6, 5, rigidLengths.upperArm);
            projectRigid(4, 3, rigidLengths.lowerArm);
            projectRigid(7, 6, rigidLengths.lowerArm);

            // Legs
            projectRigid(9, 8, rigidLengths.thigh);
            projectRigid(12, 11, rigidLengths.thigh);
            projectRigid(10, 9, rigidLengths.calf);
            projectRigid(13, 12, rigidLengths.calf);

            // Hand rigid constraints
            if (typeof handsActive !== 'undefined' && handsActive && (rigidLengths.rHand || rigidLengths.lHand)) {
                const processHand = (handSpheres, handLengths) => {
                    const getHWP = i => handSpheres[i].getWorldPosition(new THREE.Vector3());
                    
                    const translateHandDesc = (idx, delta) => {
                        if (delta.lengthSq() < 1e-8) return;
                        const toMove = [idx];
                        let changed = true;
                        while(changed) {
                            changed = false;
                            for (const [a, b] of OP_HAND_CONNECTIONS) {
                                if (toMove.includes(a) && !toMove.includes(b)) {
                                    toMove.push(b);
                                    changed = true;
                                }
                            }
                        }
                        for (const c of toMove) {
                            const sp = handSpheres[c];
                            const wp = sp.getWorldPosition(new THREE.Vector3()).add(delta);
                            if (sp.parent) sp.parent.worldToLocal(wp);
                            sp.position.copy(wp);
                            sp.updateMatrixWorld(true);
                        }
                    };

                    const projectHandRigid = (childIdx, parentIdx, targetLength) => {
                        if (!forceAll && typeof draggedJoint !== 'undefined' && draggedJoint !== handSpheres[childIdx] && draggedJoint !== handSpheres[parentIdx]) return;
                        
                        const parentWP = getHWP(parentIdx);
                        const childWP = getHWP(childIdx);
                        const currentDist = childWP.distanceTo(parentWP);
                        
                        if (Math.abs(currentDist - targetLength) > 1e-4) {
                            let dir = new THREE.Vector3().subVectors(childWP, parentWP);
                            if (dir.lengthSq() < 1e-6) dir.set(0, -1, 0);
                            else dir.normalize();
                            
                            const newWP = parentWP.clone().addScaledVector(dir, targetLength);
                            const delta = new THREE.Vector3().subVectors(newWP, childWP);
                            translateHandDesc(childIdx, delta);
                        }
                    };

                    for (const {idx, len} of handLengths.baseOffsets) {
                        projectHandRigid(idx, 0, len);
                    }
                    
                    for (const {a, b, len} of handLengths.lengths) {
                        projectHandRigid(b, a, len);
                    }
                };
                
                if (opAppendages.rightHand && opAppendages.rightHand.length > 0) processHand(opAppendages.rightHand, rigidLengths.rHand);
                if (opAppendages.leftHand && opAppendages.leftHand.length > 0) processHand(opAppendages.leftHand, rigidLengths.lHand);
            }
        }

        // ══════════════════════════════════════════════
        function saveState() {
            const state = jointNodes.map(j => ({ x: j.position.x, y: j.position.y, z: j.position.z }));
            undoStack.push(state);
            redoStack = [];
        }
        function applyState(state) {
            for (let i = 0; i < jointNodes.length && i < state.length; i++)
                jointNodes[i].position.set(state[i].x, state[i].y, state[i].z);
            updateOpBones();
            updateOpAppendageBones();
        }
        function undo() { if (undoStack.length > 1) { redoStack.push(undoStack.pop()); applyState(undoStack[undoStack.length - 1]); } }
        function redo() { if (redoStack.length > 0) { const s = redoStack.pop(); undoStack.push(s); applyState(s); } }

        // ══════════════════════════════════════════════
        // BACKGROUND SETUP (for alignment)
        // ══════════════════════════════════════════════
        function setupBackground(tex) {
            if (bgMesh) scene.remove(bgMesh);
            if (gridHelper) { scene.remove(gridHelper); gridHelper = null; }
            if (axesHelper) { scene.remove(axesHelper); axesHelper = null; }
            scene.background = new THREE.Color(0x181818);
            const w = tex.image.width, h = tex.image.height;
            tex.colorSpace = THREE.SRGBColorSpace;
            bgImageWidth = w; bgImageHeight = h;
            const fovR = 55 * Math.PI / 180;
            const focal = Math.max(w, h) / (2 * Math.tan(fovR / 2));
            const vFovR = 2 * Math.atan(h / (2 * focal));
            const vFovD = vFovR * 180 / Math.PI;
            const z_bg = -2000;
            const bgH = 2 * Math.abs(z_bg) * Math.tan(vFovR / 2);
            const bgW = bgH * (w / h);
            bgMesh = new THREE.Mesh(
                new THREE.PlaneGeometry(bgW, bgH),
                new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide, depthTest: false, depthWrite: false })
            );
            bgMesh.position.set(0, 0, z_bg); bgMesh.renderOrder = -1;
            scene.add(bgMesh);

            // Update existing camera instead of creating a new one
            camera.fov = vFovD;
            camera.aspect = w / h;
            camera.near = 0.1;
            camera.far = 100000;
            camera.position.set(0, 0, 0);
            camera.updateProjectionMatrix();

            // Update existing OrbitControls
            orbit.target.set(0, 0, -2000);
            // orbit.enableRotate stays false; screen-space rotation is always active
            orbit.update();

            onResize();
        }

        // ══════════════════════════════════════════════
        // EXPORT
        // ══════════════════════════════════════════════

        /** Project 3D OpenPose joints through current camera → render 2D skeleton PNG */
        function renderOpenPoseFrom3D(W, H) {
            if (jointNodes.length === 0) return null;
            const canvas = document.createElement('canvas');
            canvas.width = W; canvas.height = H;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

            // Sizes calibrated against 512px ref. Bone middle full-width = `stickwidth`
            // (Canvas ctx.ellipse radiusY is a half-extent → use stickwidth*0.5 below).
            // Joint diameter is set to match that same full-width so dots don't look
            // oversized relative to limbs.
            const ref = 512;
            const stickwidth = Math.max(2, Math.round(4 * Math.max(W, H) / ref));
            const jointR = Math.max(2, Math.round(stickwidth * 0.5));

            // Process each person group
            const persons = opPersonGroups;

            for (const { joints } of persons) {
                if (!joints || joints.length < 2) continue;
                // Project all joints to 2D
                const kp = joints.map(j => {
                    const wp = j.getWorldPosition(new THREE.Vector3());
                    wp.project(camera);          // → NDC [-1, 1]
                    return {
                        x: (wp.x * 0.5 + 0.5) * W,
                        y: (-wp.y * 0.5 + 0.5) * H,
                        visible: j.visible && wp.z <= 1      // behind camera if z > 1
                    };
                });
                // Draw limbs as tapered ellipses (matches cv2.ellipse + fillConvexPoly
                // used by upstream OpenPose util.py — fat in middle, points at joints).
                ctx.globalAlpha = 0.6;
                for (let li = 0; li < OP_LIMBS.length; li++) {
                    const [a, b] = OP_LIMBS[li];
                    if (a >= kp.length || b >= kp.length) continue;
                    if (!kp[a].visible || !kp[b].visible) continue;
                    const x1 = kp[a].x, y1 = kp[a].y;
                    const x2 = kp[b].x, y2 = kp[b].y;
                    const dx = x2 - x1, dy = y2 - y1;
                    const len = Math.sqrt(dx * dx + dy * dy);
                    if (len < 1) continue;
                    const mx = (x1 + x2) * 0.5, my = (y1 + y2) * 0.5;
                    const angle = Math.atan2(dy, dx);
                    const c = OP_LIMB_COLORS[li];
                    const r = (c >> 16) & 0xff, g = (c >> 8) & 0xff, bl = c & 0xff;
                    ctx.fillStyle = `rgb(${r},${g},${bl})`;
                    ctx.beginPath();
                    // major radius = length/2 along bone, minor radius = stickwidth/2
                    ctx.ellipse(mx, my, len * 0.5, stickwidth * 0.5, angle, 0, Math.PI * 2);
                    ctx.fill();
                }
                // Draw joints
                ctx.globalAlpha = 1.0;
                for (let i = 0; i < kp.length; i++) {
                    if (!kp[i].visible) continue;
                    const c = OP_JOINT_COLORS[i];
                    const r = (c >> 16) & 0xff, g = (c >> 8) & 0xff, bl = c & 0xff;
                    ctx.beginPath(); ctx.arc(kp[i].x, kp[i].y, jointR, 0, Math.PI * 2);
                    ctx.fillStyle = `rgb(${r},${g},${bl})`; ctx.fill();
                }
            }
            // ── Appendage hands ────────────────────────────────────────────────────
            if (currentMode === 'openpose') {
                function drawOpHand(joints, alpha) {
                    if (!joints || joints.length === 0) return;
                    const pts = joints.map(j => {
                        const wp = j.getWorldPosition(new THREE.Vector3());
                        wp.project(camera);
                        return { x: (wp.x * 0.5 + 0.5) * W, y: (-wp.y * 0.5 + 0.5) * H, vis: wp.z <= 1 };
                    });
                    ctx.globalAlpha = alpha;
                    for (const [a, b] of OP_HAND_CONNECTIONS) {
                        if (!pts[a]?.vis || !pts[b]?.vis) continue;
                        const [r, g, bl] = [(fingerColorFor(a) >> 16) & 0xff, (fingerColorFor(a) >> 8) & 0xff, fingerColorFor(a) & 0xff];
                        ctx.strokeStyle = `rgb(${r},${g},${bl})`; ctx.lineWidth = Math.max(1, stickwidth * 0.4);
                        ctx.beginPath(); ctx.moveTo(pts[a].x, pts[a].y); ctx.lineTo(pts[b].x, pts[b].y); ctx.stroke();
                    }
                    ctx.globalAlpha = 1;
                    for (let i = 0; i < pts.length; i++) {
                        if (!pts[i]?.vis) continue;
                        const [r, g, bl] = [(fingerColorFor(i) >> 16) & 0xff, (fingerColorFor(i) >> 8) & 0xff, fingerColorFor(i) & 0xff];
                        ctx.beginPath(); ctx.arc(pts[i].x, pts[i].y, Math.max(2, jointR * 0.6), 0, Math.PI * 2);
                        ctx.fillStyle = `rgb(${r},${g},${bl})`; ctx.fill();
                    }
                }
                drawOpHand(opAppendages.rightHand, 0.9);
                drawOpHand(opAppendages.leftHand, 0.9);

                // Feet: render only foot meshes to an offscreen RT, then composite via 'screen'
                // blending so the black background becomes transparent.
                const hasFeet = opFeetMeshes.left || opFeetMeshes.right;
                if (hasFeet) {
                    const rt = new THREE.WebGLRenderTarget(W, H);
                    // Hide everything except foot meshes
                    const hidden = [];
                    scene.traverse(obj => {
                        if (!obj.isMesh) return;
                        const isFoot = (opFeetMeshes.left && isDescendant(obj, opFeetMeshes.left)) ||
                            (opFeetMeshes.right && isDescendant(obj, opFeetMeshes.right)) ||
                            obj === opFeetMeshes.left || obj === opFeetMeshes.right;
                        if (!isFoot) { hidden.push(obj); obj.visible = false; }
                    });
                    const oldBg = scene.background;
                    scene.background = new THREE.Color(0x000000);
                    tcl.visible = false;
                    renderer.setRenderTarget(rt);
                    renderer.render(scene, camera);
                    renderer.setRenderTarget(null);
                    tcl.visible = true;
                    scene.background = oldBg;
                    hidden.forEach(o => o.visible = true);

                    const buf = new Uint8Array(W * H * 4);
                    renderer.readRenderTargetPixels(rt, 0, 0, W, H, buf);
                    rt.dispose();

                    // Flip Y into ImageData
                    const img = new Uint8ClampedArray(W * H * 4);
                    for (let row = 0; row < H; row++) {
                        const srcRow = (H - 1 - row) * W * 4;
                        for (let col = 0; col < W; col++) {
                            const s = srcRow + col * 4, d = (row * W + col) * 4;
                            img[d] = buf[s]; img[d + 1] = buf[s + 1]; img[d + 2] = buf[s + 2]; img[d + 3] = 255;
                        }
                    }
                    const fc = document.createElement('canvas'); fc.width = W; fc.height = H;
                    fc.getContext('2d').putImageData(new ImageData(img, W, H), 0, 0);

                    // 'screen' blend: black pixels (bg) become transparent, foot pixels shine through
                    ctx.globalAlpha = 1;
                    ctx.globalCompositeOperation = 'screen';
                    ctx.drawImage(fc, 0, 0);
                    ctx.globalCompositeOperation = 'source-over';
                }
            }

            return canvas.toDataURL('image/png');
        }

        function isDescendant(obj, ancestor) {
            let cur = obj.parent;
            while (cur) { if (cur === ancestor) return true; cur = cur.parent; }
            return false;
        }

        /**
         * Render depth map via two passes:
         *  Pass 1 — normal scene render to DepthTexture (Three.js handles SkinnedMesh automatically).
         *  Pass 2 — full-screen quad converts NDC depth → linear grayscale (near=white, far=black).
         * Skeleton joints/bones are hidden; only mannequin + feet appear.
         */
        function renderDepthMap(W, H) {
            if (jointNodes.length === 0 && !mannequinGroup) return null;

            // ── Bounds from joint positions (reflect current pose) ──────────────────
            let minZ = Infinity, maxZ = -Infinity;
            const _bbox = new THREE.Box3();
            const _corners = [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(),
            new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()];
            function expandBoundsFromObject(obj) {
                _bbox.setFromObject(obj);
                if (_bbox.isEmpty()) return;
                const mn = _bbox.min, mx = _bbox.max;
                _corners[0].set(mn.x, mn.y, mn.z); _corners[1].set(mx.x, mn.y, mn.z);
                _corners[2].set(mn.x, mx.y, mn.z); _corners[3].set(mx.x, mx.y, mn.z);
                _corners[4].set(mn.x, mn.y, mx.z); _corners[5].set(mx.x, mn.y, mx.z);
                _corners[6].set(mn.x, mx.y, mx.z); _corners[7].set(mx.x, mx.y, mx.z);
                _corners.forEach(c => {
                    c.applyMatrix4(camera.matrixWorldInverse);
                    const dv = -c.z;
                    if (dv < minZ) minZ = dv;
                    if (dv > maxZ) maxZ = dv;
                });
            }
            [...jointNodes, ...boneMeshes].forEach(expandBoundsFromObject);
            if (opFeetMeshes.left) expandBoundsFromObject(opFeetMeshes.left);
            if (opFeetMeshes.right) expandBoundsFromObject(opFeetMeshes.right);
            opAppendages.leftHand.forEach(expandBoundsFromObject);
            opAppendages.rightHand.forEach(expandBoundsFromObject);

            const pad = mannequinGroup ? 0.8 : 0.3;

            // shaderNear/shaderFar: tight range around the body → good depth contrast in the output image
            const shaderNear = (minZ !== Infinity) ? Math.max(0.01, minZ - pad) : 0.1;
            const shaderFar = (maxZ !== -Infinity) ? maxZ + pad : 20;

            // Camera clip planes: VERY generous so no part of the mannequin is ever clipped.
            // perspectiveDepthToViewZ in the quad shader must use these same values to unpack correctly.
            const oldNear = camera.near, oldFar = camera.far;
            camera.near = 0.01;
            camera.far = Math.max(shaderFar + 2.0, 20);
            camera.updateProjectionMatrix();
            const camNear = camera.near, camFar = camera.far;

            // ── Hide skeleton; show mannequin only (if loaded) ───────────────────────
            const hiddenForDepth = [];
            if (mannequinGroup) {
                [...jointNodes, ...boneMeshes].forEach(obj => {
                    if (obj.visible) { obj.visible = false; hiddenForDepth.push(obj); }
                });
                for (const b of opAppendageBones) {
                    if (b.mesh.visible) { b.mesh.visible = false; hiddenForDepth.push(b.mesh); }
                }
            }

            scene.remove(tcl);
            const oldBg = scene.background;
            scene.background = new THREE.Color(0x000000);
            if (bgMesh) bgMesh.visible = false;

            // ── Pass 1: normal render → DepthTexture ─────────────────────────────────
            const depthTex = new THREE.DepthTexture(W, H);
            depthTex.minFilter = THREE.NearestFilter;
            depthTex.magFilter = THREE.NearestFilter;
            const rtDepth = new THREE.WebGLRenderTarget(W, H, { depthBuffer: true, depthTexture: depthTex });

            renderer.setRenderTarget(rtDepth);
            renderer.render(scene, camera);
            renderer.setRenderTarget(null);

            // ── Pass 2: depth → linear grayscale via full-screen quad ────────────────
            const rtColor = new THREE.WebGLRenderTarget(W, H);
            const quadMat = new THREE.ShaderMaterial({
                uniforms: {
                    tDepth: { value: depthTex },
                    camNear: { value: camNear },  // actual projection near — for correct NDC→viewZ unpack
                    camFar: { value: camFar },  // actual projection far
                    shaderNear: { value: shaderNear }, // tight body range — for brightness contrast
                    shaderFar: { value: shaderFar }
                },
                depthTest: false, depthWrite: false,
                vertexShader: `
            varying vec2 vUv;
            void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
        `,
                fragmentShader: `
            #include <packing>
            varying vec2 vUv;
            uniform sampler2D tDepth;
            uniform float camNear;
            uniform float camFar;
            uniform float shaderNear;
            uniform float shaderFar;
            void main() {
                float d = texture2D(tDepth, vUv).r;
                if (d >= 1.0) { gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); return; }
                float viewZ = perspectiveDepthToViewZ(d, camNear, camFar);
                float t     = clamp((-viewZ - shaderNear) / (shaderFar - shaderNear), 0.0, 1.0);
                gl_FragColor = vec4(vec3(1.0 - t), 1.0);
            }
        `
            });
            const quadGeo = new THREE.PlaneGeometry(2, 2);
            const quadMesh = new THREE.Mesh(quadGeo, quadMat);
            quadMesh.frustumCulled = false;
            const quadScene = new THREE.Scene();
            quadScene.add(quadMesh);

            renderer.setRenderTarget(rtColor);
            renderer.render(quadScene, new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1));
            renderer.setRenderTarget(null);

            // ── Restore ──────────────────────────────────────────────────────────────
            camera.near = oldNear; camera.far = oldFar; camera.updateProjectionMatrix();
            scene.background = oldBg; scene.add(tcl);
            if (bgMesh) bgMesh.visible = true;
            hiddenForDepth.forEach(obj => { obj.visible = true; });

            // ── Readback + flip Y ────────────────────────────────────────────────────
            const buf = new Uint8Array(W * H * 4);
            renderer.readRenderTargetPixels(rtColor, 0, 0, W, H, buf);
            rtDepth.dispose(); rtColor.dispose(); depthTex.dispose();
            quadMat.dispose(); quadGeo.dispose();

            const img = new Uint8ClampedArray(W * H * 4);
            for (let row = 0; row < H; row++) {
                const srcRow = (H - 1 - row) * W * 4;
                for (let col = 0; col < W; col++) {
                    const s = srcRow + col * 4, d2 = (row * W + col) * 4;
                    img[d2] = buf[s]; img[d2 + 1] = buf[s]; img[d2 + 2] = buf[s]; img[d2 + 3] = 255;
                }
            }
            const c = document.createElement('canvas'); c.width = W; c.height = H;
            c.getContext('2d').putImageData(new ImageData(img, W, H), 0, 0);
            return c.toDataURL('image/png');
        }

        /** Render wholebody OpenPose-style 2D image from current 3D joint positions */
        function renderWholebodyFrom3D(W, H) {
            const canvas = document.createElement('canvas');
            canvas.width = W; canvas.height = H;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

            function project(mesh) {
                const wp = mesh.getWorldPosition(new THREE.Vector3());
                wp.project(camera);
                return { x: (wp.x * 0.5 + 0.5) * W, y: (-wp.y * 0.5 + 0.5) * H, vis: wp.z <= 1 };
            }
            function hexToRGB(hex) { return [(hex >> 16) & 0xff, (hex >> 8) & 0xff, hex & 0xff]; }

            // ── Body (subset → COCO-18 for FLUX compatibility) ─────────────────────
            if (wbJoints.body.length >= 33) {
                // Build COCO-18 keypoints
                const coco = new Array(18).fill(null);
                for (const [bpIdx, cocoIdx] of BP_COCO18) {
                    if (bpIdx < wbJoints.body.length) coco[cocoIdx] = project(wbJoints.body[bpIdx]);
                }
                // Neck = avg of shoulders
                const rs = project(wbJoints.body[12]), ls = project(wbJoints.body[11]);
                coco[1] = { x: (rs.x + ls.x) / 2, y: (rs.y + ls.y) / 2, vis: rs.vis && ls.vis };

                // Draw body limbs
                ctx.globalAlpha = 0.75;
                for (let li = 0; li < OP_LIMBS.length; li++) {
                    const [a, b] = OP_LIMBS[li];
                    if (!coco[a]?.vis || !coco[b]?.vis) continue;
                    const [r, g, bl] = hexToRGB(OP_LIMB_COLORS[li]);
                    ctx.strokeStyle = `rgb(${r},${g},${bl})`; ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.moveTo(coco[a].x, coco[a].y); ctx.lineTo(coco[b].x, coco[b].y); ctx.stroke();
                }
                // Draw body joints
                ctx.globalAlpha = 1;
                for (let i = 0; i < 18; i++) {
                    if (!coco[i]?.vis) continue;
                    const [r, g, bl] = hexToRGB(OP_JOINT_COLORS[i % OP_JOINT_COLORS.length]);
                    ctx.beginPath(); ctx.arc(coco[i].x, coco[i].y, 5, 0, Math.PI * 2);
                    ctx.fillStyle = `rgb(${r},${g},${bl})`; ctx.fill();
                }
            }

            // ── Hands ──────────────────────────────────────────────────────────────
            function drawHand(joints, connections, alpha) {
                if (!joints || joints.length === 0) return;
                const pts = joints.map(j => project(j));
                ctx.globalAlpha = alpha;
                for (const [a, b] of connections) {
                    if (!pts[a]?.vis || !pts[b]?.vis) continue;
                    const [r, g, bl] = hexToRGB(fingerColorFor(a));
                    ctx.strokeStyle = `rgb(${r},${g},${bl})`; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(pts[a].x, pts[a].y); ctx.lineTo(pts[b].x, pts[b].y); ctx.stroke();
                }
                ctx.globalAlpha = 1;
                for (let i = 0; i < pts.length; i++) {
                    if (!pts[i]?.vis) continue;
                    const [r, g, bl] = hexToRGB(fingerColorFor(i));
                    ctx.beginPath(); ctx.arc(pts[i].x, pts[i].y, 3, 0, Math.PI * 2);
                    ctx.fillStyle = `rgb(${r},${g},${bl})`; ctx.fill();
                }
            }
            const handConns = wbData?.hand_connections || [];
            drawHand(wbJoints.leftHand, handConns, 0.85);
            drawHand(wbJoints.rightHand, handConns, 0.85);

            // ── Face outline ───────────────────────────────────────────────────────
            if (wbJoints.face.length > 0 && wbData?.face_connections) {
                const fps = wbJoints.face.map(j => project(j));
                ctx.globalAlpha = 0.7;
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
                for (const [a, b] of wbData.face_connections) {
                    if (!fps[a]?.vis || !fps[b]?.vis) continue;
                    ctx.beginPath(); ctx.moveTo(fps[a].x, fps[a].y); ctx.lineTo(fps[b].x, fps[b].y); ctx.stroke();
                }
                ctx.globalAlpha = 1; ctx.fillStyle = '#cccccc';
                for (const pt of fps) {
                    if (!pt.vis) continue;
                    ctx.beginPath(); ctx.arc(pt.x, pt.y, 1.5, 0, Math.PI * 2); ctx.fill();
                }
            }

            ctx.globalAlpha = 1;
            return canvas.toDataURL('image/png');
        }

        function exportAll() {
            const W = bgImageWidth > 0 ? bgImageWidth : window.innerWidth;
            const H = bgImageHeight > 0 ? bgImageHeight : window.innerHeight;

            const depthDataUrl = renderDepthMap(W, H);

            if (currentMode === 'wholebody') {
                const dataUrl = renderWholebodyFrom3D(W, H);
                const wbJointData = {
                    body: wbJoints.body.map(j => { const p = j.getWorldPosition(new THREE.Vector3()); return [p.x, p.y, p.z]; }),
                    leftHand: wbJoints.leftHand.map(j => { const p = j.getWorldPosition(new THREE.Vector3()); return [p.x, p.y, p.z]; }),
                    rightHand: wbJoints.rightHand.map(j => { const p = j.getWorldPosition(new THREE.Vector3()); return [p.x, p.y, p.z]; }),
                    face: wbJoints.face.map(j => { const p = j.getWorldPosition(new THREE.Vector3()); return [p.x, p.y, p.z]; }),
                };
                window.parent.postMessage({
                    type: 'GLB_EXPORTED',
                    data: JSON.stringify({ mode: 'wholebody', joints: wbJointData }),
                    dataUrl,
                    depthDataUrl,
                }, '*');
                return;
            }

            // Render OpenPose 2D skeleton
            const dataUrl = renderOpenPoseFrom3D(W, H);

            const personsData = opPersonGroups.map(({ joints }) =>
                joints.map(j => { 
                    if (!j.visible) return { x: 0, y: 0, z: 0 };
                    const p = j.getWorldPosition(new THREE.Vector3()); 
                    return { x: p.x, y: p.y, z: p.z }; 
                })
            );
            const toXYZ = j => { const p = j.getWorldPosition(new THREE.Vector3()); return [p.x, p.y, p.z]; };
            const footTransform = (group) => {
                if (!group) return null;
                const p = new THREE.Vector3(); group.getWorldPosition(p);
                const q = new THREE.Quaternion(); group.getWorldQuaternion(q);
                return { position: [p.x, p.y, p.z], quaternion: [q.x, q.y, q.z, q.w] };
            };
            const appendagesData = {
                rightHand: opAppendages.rightHand.map(toXYZ),
                leftHand: opAppendages.leftHand.map(toXYZ),
                rightFoot: footTransform(opFeetMeshes.right),
                leftFoot: footTransform(opFeetMeshes.left),
            };
            window.parent.postMessage({
                type: 'GLB_EXPORTED',
                data: JSON.stringify({ mode: 'openpose', persons: personsData, appendages: appendagesData }),
                dataUrl,
                depthDataUrl,
            }, '*');
        }

        // ══════════════════════════════════════════════
        // CAMERA RESET
        // ══════════════════════════════════════════════
        function resetCamera() {
            camera.up.set(0, 1, 0);
            if (bgImageWidth > 0 && bgImageHeight > 0) {
                camera.position.set(0, 0, 0);
                orbit.target.set(0, 0, -2000);
            } else {
                camera.position.set(0, 0.85, 3.5);
                orbit.target.set(0, 0.85, 0);
            }
            orbit.update();
        }

        // ══════════════════════════════════════════════
        // MESSAGE HANDLER
        // ══════════════════════════════════════════════
        function onMessage(e) {
            const msg = e.data;
            if (!msg?.type) return;

            switch (msg.type) {
                case 'INIT_MODE': {
                    // msg.mode: 'openpose' | 'wholebody'   msg.bgUrl?: string
                    const mode = msg.mode || 'openpose';
                    setMode(mode);
                    if (mode === 'openpose' && opPersonGroups.length === 0) {
                        addOpenPosePerson(0);
                        saveState();
                    }
                    if (msg.bgUrl) loadBg(msg.bgUrl);
                    break;
                }
                case 'LOAD_OPENPOSE_FROM_SCAIL': {
                    // Extract 3D joint positions from SCAIL GLB → re-map to OpenPose COCO-18 joints
                    const lid = ++currentLoadId;
                    showStatus('提取姿势中...');
                    if (msg.bgUrl) {
                        new THREE.TextureLoader().load(msg.bgUrl, tex => {
                            bgTexture = tex; bgImageWidth = tex.image.width; bgImageHeight = tex.image.height;
                            setupBackground(tex);
                            loadScailIntoOpenPose(msg.url, lid);
                        });
                    } else {
                        loadScailIntoOpenPose(msg.url, lid);
                    }
                    break;
                }

                case 'LOAD_OPENPOSE_JSON': {
                    // Restore a previously saved edited openpose skeleton (msg.data = exportAll JSON)
                    const jd = msg.data;
                    if (!jd?.persons) break;
                    // Clear all existing persons cleanly
                    while (opPersonGroups.length > 0) {
                        const { group, joints, connections } = opPersonGroups.pop();
                        jointNodes = jointNodes.filter(n => !joints.includes(n));
                        opConnections = opConnections.filter(c => !connections.includes(c));
                        const groupBoneSet = new Set();
                        group.traverse(obj => { if (obj.userData?.isOpBone) groupBoneSet.add(obj); });
                        boneMeshes = boneMeshes.filter(b => !groupBoneSet.has(b));
                        scene.remove(group);
                    }
                    tcl.detach();
                    setMode('openpose');
                    console.log('[LOAD_OPENPOSE_JSON] persons:', JSON.stringify(jd.persons).slice(0, 200));
                    jd.persons.forEach((personData, idx) => {
                        const joints = addOpenPosePerson(idx * 2);
                        const personGroup = opPersonGroups[opPersonGroups.length - 1];
                        // Support { joints:[...] } object OR raw array
                        const jointArr = Array.isArray(personData) ? personData : personData?.joints;
                        if (!Array.isArray(jointArr)) {
                            console.warn('[LOAD_OPENPOSE_JSON] unexpected personData format:', personData);
                            return;
                        }
                        jointArr.forEach((pt, i) => {
                            if (!joints[i]) return;
                            const [x, y, z] = Array.isArray(pt) ? pt : [pt.x, pt.y, pt.z];
                            joints[i].position.set(x, y, z);
                        });
                        // Restore visual scale from skeleton world extent (same logic as loadScailIntoOpenPose)
                        const box = new THREE.Box3();
                        joints.forEach(j => box.expandByPoint(j.position));
                        const size = box.getSize(new THREE.Vector3());
                        const sf = Math.max(size.x, size.y, size.z, 1e-5) / 1.7;
                        personGroup.scaleFactor = sf;
                        joints.forEach(j => j.scale.setScalar(sf));
                    });
                    updateOpBones();
                    if (msg.bgUrl) loadBg(msg.bgUrl);
                    initRigidSkeletonBaseline();   // record actual proportions as constraint target
                    saveState();
                    window.parent.postMessage({ type: 'MODEL_LOADED' }, '*');
                    break;
                }

                case 'LOAD_WHOLEBODY_JSON': {
                    // msg.data: parsed JSON from MediaPipe wholebody extractor
                    // msg.bgUrl?: background image URL
                    showStatus('加载全身骨骼...');
                    loadWholebodyJSON(msg.data, msg.bgUrl || null);
                    break;
                }
                case 'LOAD_BG_URL':
                    loadBg(msg.url);
                    break;
                case 'EXPORT_GLB':
                    exportAll();
                    break;
                case 'RESET_CAMERA':
                    resetCamera();
                    break;
            }
        }

        function loadBg(url) {
            new THREE.TextureLoader().load(url, tex => {
                bgTexture = tex;
                setupBackground(tex);
            });
        }

        // ══════════════════════════════════════════════
        // KEYBOARD
        // ══════════════════════════════════════════════
        function onKeyDown(e) {
            if (e.ctrlKey || e.metaKey) {
                if (e.key === 'z') { e.shiftKey ? redo() : undo(); }
                else if (e.key === 'y') redo();
            }
        }

        // ══════════════════════════════════════════════
        // RESIZE
        // ══════════════════════════════════════════════
        function onResize() {
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (camera.isPerspectiveCamera) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
            }
        }

        // ══════════════════════════════════════════════
        // STATUS
        // ══════════════════════════════════════════════
        function showStatus(txt, hideMs = 0) {
            const el = document.getElementById('status');
            el.textContent = txt; el.style.display = 'block'; el.style.opacity = '1';
            if (hideMs > 0) setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.style.display = 'none', 300); }, hideMs);
        }

        // NLF joint index → COCO-18 joint index (from nlf_render.py process_data_to_COCO_format)
        // NLF has 24 joints (0-23); SCAIL GLB names them joint_N where N = NLF index
        const NLF_TO_COCO18 = {
            15: 0,  // Nose (NLF head)
            12: 1,  // Neck
            17: 2,  // R.Shoulder  (NLF calls this "left shoulder" in body frame — mirrored)
            19: 3,  // R.Elbow
            21: 4,  // R.Wrist
            16: 5,  // L.Shoulder
            18: 6,  // L.Elbow
            20: 7,  // L.Wrist
            2: 8,  // R.Hip
            5: 9,  // R.Knee
            8: 10, // R.Ankle
            1: 11, // L.Hip
            4: 12, // L.Knee
            7: 13, // L.Ankle
        };


        /**
         * Load a SCAIL GLB, silently extract joint positions, map to COCO-18, then
         * position the OpenPose sphere joints accordingly. The SCAIL model itself is
         * never shown — we only use its joint coordinates.
         */
        function loadScailIntoOpenPose(url, lid) {
            new GLTFLoader().load(url, (gltf) => {
                if (lid !== currentLoadId) return;
                clearOpAppendages(); // clear stale hand/foot joints from previous pose

                // The SCAIL model coordinates are perfectly aligned with the camera frustum
                // (with focal length matching the image width/height).
                // DO NOT center or scale the model, otherwise it will lose alignment!
                const dummyScene = gltf.scene;
                const box = new THREE.Box3().setFromObject(dummyScene);
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);

                console.log(`[SCAIL Extract] Original Bounding Box Size:`, size);

                // Ensure the scene's world matrix is updated before extraction
                dummyScene.updateMatrixWorld(true);

                // OpenPose joints are designed for a 1.7 unit tall person.
                // Since the extracted person is `maxDim` units tall, we need to scale the
                // visual size of the spheres and bones so they are visible and clickable!
                const scaleFactor = maxDim / 1.7;
                console.log(`[SCAIL Extract] Visual Scale Factor for joints: ${scaleFactor}`);

                // Collect bones from the scaled model
                const boneNodes = {}; // idx -> node
                dummyScene.traverse(node => {
                    if (!node.name.startsWith('bone_')) return;
                    const idxStr = node.name.slice(5); // 'bone_12' → '12'
                    const idx = parseInt(idxStr, 10);
                    if (!isNaN(idx)) {
                        boneNodes[idx] = node;
                    }
                });

                console.log(`[SCAIL Extract] Found ${Object.keys(boneNodes).length} bone nodes`);

                // Helper to extract a bone endpoint (type 0 = start, 1 = end)
                const getBonePoint = (boneIdx, type) => {
                    const b = boneNodes[boneIdx];
                    if (!b) {
                        console.warn(`[SCAIL Extract] Bone ${boneIdx} not found!`);
                        return null;
                    }
                    // Missing bones have scale.y = 0 or close to 0
                    if (b.scale.y < 1e-4) {
                        console.warn(`[SCAIL Extract] Bone ${boneIdx} is missing (scale.y = ${b.scale.y})`);
                        return null;
                    }

                    if (type === 0) {
                        // start = world position of bone
                        const wp = new THREE.Vector3();
                        b.getWorldPosition(wp);
                        return wp;
                    } else {
                        // end = start + direction * length
                        // The bone is a cylinder from (0,0,0) to (0,1,0) in local space
                        // The matrixWorld already applies scale, rotation, and translation
                        const localEnd = new THREE.Vector3(0, 1, 0);
                        return localEnd.applyMatrix4(b.matrixWorld);
                    }
                };

                // Reconstruct COCO-18 mapped joints directly from bone endpoints
                const mapped = {}; // cocoIdx → THREE.Vector3
                const setMapped = (cocoIdx, boneIdx, type) => {
                    const wp = getBonePoint(boneIdx, type);
                    if (wp) {
                        mapped[cocoIdx] = wp;
                        console.log(`[SCAIL Extract] Mapped COCO[${cocoIdx}] from Bone[${boneIdx}] Type[${type}] ->`, wp);
                    }
                };

                // Map according to draw_seq in ComfyUI-SCAIL-Pose
                // 0: Neck -> R. Shoulder
                setMapped(1, 0, 0); // Neck
                setMapped(2, 0, 1); // R. Shoulder
                // 1: R. Shoulder -> R. Elbow
                setMapped(3, 1, 1); // R. Elbow
                // 2: R. Elbow -> R. Wrist
                setMapped(4, 2, 1); // R. Wrist
                // 3: Neck -> L. Shoulder
                setMapped(5, 3, 1); // L. Shoulder
                // 4: L. Shoulder -> L. Elbow
                setMapped(6, 4, 1); // L. Elbow
                // 5: L. Elbow -> L. Wrist
                setMapped(7, 5, 1); // L. Wrist
                // 6: Neck -> R. Hip
                setMapped(8, 6, 1); // R. Hip
                // 7: R. Hip -> R. Knee
                setMapped(9, 7, 1); // R. Knee
                // 8: R. Knee -> R. Ankle
                setMapped(10, 8, 1); // R. Ankle
                // 9: Neck -> L. Hip
                setMapped(11, 9, 1); // L. Hip
                // 10: L. Hip -> L. Knee
                setMapped(12, 10, 1); // L. Knee
                // 11: L. Knee -> L. Ankle
                setMapped(13, 11, 1); // L. Ankle
                // 12: Neck -> Nose
                setMapped(0, 12, 1); // Nose

                // Fallback: if SCAIL didn't provide R/L ankle bones, derive ankle from
                // knee and hip positions. This keeps the ankle away from the T-pose
                // default near the camera origin, so foot meshes are placed in a
                // reasonable position instead of at the lens.
                const deriveAnkle = (ankleCoco, kneeCoco, hipCoco) => {
                    if (mapped[ankleCoco]) return;
                    const knee = mapped[kneeCoco];
                    if (!knee) return;
                    const hip = mapped[hipCoco];
                    let dir;
                    let extendDistance;

                    if (hip) {
                        const hipToKnee = new THREE.Vector3().subVectors(knee, hip);
                        if (hipToKnee.lengthSq() > 1e-6) {
                            dir = hipToKnee.clone().normalize();
                            // Use the actual hip→knee length as a proxy for knee→ankle.
                            // Actual leg proportions are close enough that this produces
                            // a reasonable ankle position for missing ankle bones.
                            extendDistance = hipToKnee.length() * 0.95;
                        }
                    }

                    if (!dir) {
                        dir = new THREE.Vector3(0, -1, 0);
                        extendDistance = 0.44 * scaleFactor;
                    }

                    const ankle = knee.clone().addScaledVector(dir, extendDistance);
                    mapped[ankleCoco] = ankle;
                    console.log(`[SCAIL Extract] Derived ankle COCO[${ankleCoco}] from knee/hip →`, {
                        hip: hip ? hip.toArray() : null,
                        knee: knee.toArray(),
                        dir: dir.toArray(),
                        extendDistance,
                        ankle: ankle.toArray(),
                    });
                };
                deriveAnkle(10, 9, 8);    // R.Ankle ← R.Knee, R.Hip
                deriveAnkle(13, 12, 11);  // L.Ankle ← L.Knee, L.Hip

                // Ensure at least one OpenPose person exists
                if (opPersonGroups.length === 0) addOpenPosePerson(0);

                const personGroup = opPersonGroups[0];
                const { joints } = personGroup;
                personGroup.scaleFactor = scaleFactor; // Save for bone scaling

                // Apply mapped joints to spheres and scale them visually
                for (const [cocoIdxStr, wp] of Object.entries(mapped)) {
                    const cocoIdx = parseInt(cocoIdxStr, 10);
                    joints[cocoIdx].position.copy(wp);
                }
                for (const joint of joints) {
                    joint.scale.setScalar(scaleFactor);
                }

                // ── Reconstruct face joints (Nose, Eyes, Ears) ────────────────────
                // SCAIL often gives no/degenerate face data, and even when bone_12
                // exists its direction is near-axial to the camera, so deriving the
                // face scale from neck→nose distance produces offsets smaller than
                // the joint sphere radius (JOINT_R_OP × scaleFactor) → 5 spheres pile
                // onto one point. Drive face proportions from `scaleFactor` itself,
                // mirroring the calibrated T-pose offsets (eye 5cm/5cm, ear 9cm) in
                // the same units the sphere radii live in.
                let nose = mapped[0];
                const neck = mapped[1];
                const rshldr = mapped[2];
                const lshldr = mapped[5];
                const rhip = mapped[8];
                const lhip = mapped[11];

                if (neck) {
                    // upDir: nose→neck if face data exists, otherwise extrapolate
                    // along the spine (midHip → neck).
                    let upDir = null;
                    if (nose) {
                        const d = new THREE.Vector3().subVectors(nose, neck);
                        if (d.lengthSq() > 1e-6) upDir = d.normalize();
                    }
                    if (!upDir && rhip && lhip) {
                        const midHip = new THREE.Vector3().addVectors(rhip, lhip).multiplyScalar(0.5);
                        const d = new THREE.Vector3().subVectors(neck, midHip);
                        if (d.lengthSq() > 1e-6) upDir = d.normalize();
                    }
                    if (!upDir) upDir = new THREE.Vector3(0, 1, 0);

                    // sideDir: right shoulder → left shoulder (OpenPose convention)
                    let sideDir;
                    if (rshldr && lshldr) {
                        const d = new THREE.Vector3().subVectors(rshldr, lshldr);
                        sideDir = d.lengthSq() > 1e-6 ? d.normalize() : new THREE.Vector3(1, 0, 0);
                    } else {
                        sideDir = new THREE.Vector3(1, 0, 0);
                    }
                    // Orthonormalize side against up
                    sideDir.addScaledVector(upDir, -sideDir.dot(upDir));
                    if (sideDir.lengthSq() < 1e-6) sideDir.set(1, 0, 0);
                    sideDir.normalize();

                    // forwardDir = side × up (the direction the person faces)
                    const forwardDir = new THREE.Vector3().crossVectors(sideDir, upDir).normalize();

                    // Synthesize nose 15cm above neck along the spine if missing
                    if (!nose) {
                        nose = neck.clone().add(upDir.clone().multiplyScalar(0.15 * scaleFactor));
                        joints[0].position.copy(nose);
                        mapped[0] = nose;
                        console.log('[SCAIL Extract] Synthesized Nose from spine -> ', nose);
                    }

                    // T-pose proportions: eye (±0.05, +0.05) ear (±0.09, 0), with a
                    // small forward bias on the eyes and slight back bias on the ears.
                    const u = scaleFactor;
                    const rEye = nose.clone()
                        .add(upDir.clone().multiplyScalar(0.05 * u))
                        .add(sideDir.clone().multiplyScalar(0.05 * u))
                        .add(forwardDir.clone().multiplyScalar(0.02 * u));
                    const lEye = nose.clone()
                        .add(upDir.clone().multiplyScalar(0.05 * u))
                        .sub(sideDir.clone().multiplyScalar(0.05 * u))
                        .add(forwardDir.clone().multiplyScalar(0.02 * u));
                    const rEar = nose.clone()
                        .add(sideDir.clone().multiplyScalar(0.09 * u))
                        .sub(forwardDir.clone().multiplyScalar(0.03 * u));
                    const lEar = nose.clone()
                        .sub(sideDir.clone().multiplyScalar(0.09 * u))
                        .sub(forwardDir.clone().multiplyScalar(0.03 * u));

                    joints[14].position.copy(rEye);
                    joints[15].position.copy(lEye);
                    joints[16].position.copy(rEar);
                    joints[17].position.copy(lEar);
                    console.log('[SCAIL Extract] Face reconstructed (scaleFactor=' + u.toFixed(1) + ')');
                }

                // Force bone refresh
                updateOpBones();
                initRigidSkeletonBaseline();   // record actual proportions as constraint target
                saveState();

                const nMapped = Object.keys(mapped).length;
                showStatus(`已从 SCAIL 导入 ${nMapped}/14 个关节点`, 3000);
                window.parent.postMessage({ type: 'MODEL_LOADED' }, '*');
            }, undefined, err => {
                console.error('loadScailIntoOpenPose error:', err);
                showStatus('骨骼导入失败', 3000);
                window.parent.postMessage({ type: 'MODEL_ERROR', error: err.message }, '*');
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            if (currentMode === 'wholebody') tickWholebodyBones();
            else updateOpBones();
            updateOpAppendageBones();
            updateOpFootMeshes();
            if (showMannequin && currentMode === 'openpose') poseMannequinFromJoints();
            renderer.render(scene, camera);
        }


        // ══════════════════════════════════════════════
        // BOOT
        // ══════════════════════════════════════════════
        init();
        preloadFootFbx();    // non-blocking; foot.fbx ready before user clicks "脚"
        preloadMannequin();  // non-blocking; anime_basic_female.fbx ready before user clicks "人偶"

        // Default: OpenPose mode with one T-pose person
        setMode('openpose');
        addOpenPosePerson(0);
        initRigidSkeletonBaseline();
        saveState();

        // Signal ready
        window.parent.postMessage({ type: 'VIEWER_READY' }, '*');
    </script>
</body>
